[project]
name = "recsys"
version = "0.1.0"
description = "Movie Recommendation System ML package"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scipy>=1.14.0",
    "scikit-learn>=1.5.0",
    "numba>=0.60.0",
    "optuna>=4.0.0",
    "typer>=0.12.0",
    "requests>=2.32.0",
    "tqdm>=4.66.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]

[project.scripts]
recsys = "recsys.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]
