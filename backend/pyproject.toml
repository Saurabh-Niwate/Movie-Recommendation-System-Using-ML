[project]
name = "cinematch-backend"
version = "0.1.0"
description = "FastAPI backend for CineMatch"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
    "cachetools>=5.5.0",
    "rapidfuzz>=3.9.0",
    "structlog>=24.4.0",
    "recsys",
]

[tool.uv.sources]
recsys = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
